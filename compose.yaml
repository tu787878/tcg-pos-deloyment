name: tcg-pos

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  api:
    image: ${API_IMAGE:?API_IMAGE is required}:${APP_VERSION:?APP_VERSION is required}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ASSET_STORAGE_PATH: /data/assets
      JWT_PUBLIC_KEY_LOCATION: file:/tmp/simple-pos-secrets/simple-pos-jwt-public.pem
      JWT_PRIVATE_KEY_LOCATION: file:/tmp/simple-pos-secrets/simple-pos-jwt-private.pem
    volumes:
      - asset-data:/data/assets
      - ./secrets:/run/secrets-input:ro
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - frontend
      - backend

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}:${APP_VERSION:?APP_VERSION is required}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
        restart: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend

  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot:v5.1.0}
    profiles: ["tools"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

volumes:
  postgres-data:
  asset-data:
  letsencrypt:
  certbot-webroot:

networks:
  frontend:
  backend:
    internal: true

